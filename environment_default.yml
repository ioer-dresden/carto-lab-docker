name: worker_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.7
  - pip
  - adjusttext
  - contextily
  - colorcet
  - esda
  - 'geoviews-core=1.9.5'
  - 'holoviews=1.14.8'
  - 'ipywidgets=8.0.*'
  - ipyleaflet
  - datashader
  - descartes
  - geoalchemy2
  - geopandas
  - geopy
  - hvplot
  - flopy
  - ipython-sql
  - 'numpy<1.23' # Shapely 1.7.1 compatibility
  - mapclassify
  - matplotlib-venn
  - matplotlib-scalebar
  - memory_profiler
  - mmh3
  - pyepsg
  - psycopg2
  - python-dotenv
  - rasterio
  - seaborn
  - 'shapely=1.7.1'
  - tagmaps
  - xarray
  - pip:
    - python-hll
