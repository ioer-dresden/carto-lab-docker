name: jupyter_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.7
  - pip
  - 'ipywidgets=7.5.*'
  - jupyter_contrib_nbextensions
  - jupyter_nbextensions_configurator
  - jupyterlab
  - jupyterlab-git
  - jupytext
  - nbconvert=5.6.1 # pin, until template issue fixed
  - papermill