name: jupyter_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.7
  - pip
  - jupyter_contrib_nbextensions
  - jupyter_nbextensions_configurator
  - jupyterlab>=3
  # - jupyterlab-git
  - jupytext
  - jupyterlab_widgets
  - nbconvert=5.6.1 # pin, until template issue fixed
  - nbclassic # for backwards compatibility
  - papermill
  - selenium
  - geckodriver
  - firefox