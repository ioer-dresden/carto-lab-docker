name: jupyter_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - pip
  - jupyterlab>=4
  # - jupyterlab-git
  - jupytext
  - jupyterlab_widgets
  - 'nbconvert=7.2.*' # nbconvert sometimes has issues with latest release candidates, pin to stable
  - nbclassic # for backwards compatibility
  - papermill
  - pyviz_comms
  - pip:
    - jupyterlab-spellchecker