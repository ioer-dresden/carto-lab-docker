version: '3.6'

services:

  jupyterlab:
    build: .
    image: registry.gitlab.vgiscience.org/lbsn/tools/jupyterlab
    container_name: ${CONTAINER_NAME:-lbsn-jupyterlab}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${JUPYTER_WEBPORT:-8888}:8888
    volumes:
      - ${JUPYTER_HOME:-/data/lbsn/notebooks}:/home/jovyan/work
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-d3f4u1tp455w0Rd}
      - JUPYTER_WEBURL=${JUPYTER_WEBURL:-https://jupyterlab.example.org}
    networks:
      - lbsn-network

networks:
  lbsn-network:
    name: ${NETWORK_NAME:-lbsn-network}
    external: true
